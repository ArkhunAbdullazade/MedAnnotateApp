services:
  webapp:
    image: medannotateapp:research
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - key_data:/app/keys
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_HTTPS_PORT: 443
      ConnectionStrings__MedDataDb: ${AZURE_POSTGRES_CONNECTION_STRING:?Set the managed PostgreSQL connection string}
      AuthorizationAccessPasswordHash: ${AUTHORIZATION_ACCESS_PASSWORD_HASH:?Set the research gate hash}
      DataProtection__KeysPath: /app/keys
      AllowedHosts: ${PUBLIC_HOST:?Set the public hostname}
      ReverseProxy__KnownProxies__0: ${REVERSE_PROXY_IP:?Set the actual reverse proxy source address}
      Database__ApplyMigrations: "false"
      Database__SeedExcel: "false"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  key_data:
