<!doctype html><html lang="en"><meta charset="utf-8"><title>Stored remote image display checks</title>
<style>body{font:16px Arial;margin:24px}.left-column{width:650px;max-width:90vw;margin-bottom:32px}canvas{display:block;border:0;padding:0;max-width:100%}.result{padding:8px;background:#eef3f7}img[hidden]{display:none}</style>
<h1>Stored image URL checks</h1><p>Samples read from PostgreSQL: first, middle and last NEJM records. Rendering uses the application's CanvasManager. No image proxy or image download is used.</p>
<div id="results"></div>
<script src="../../src/MedAnnotateApp.Presentation/wwwroot/js/annotationGeometry.js"></script>
<script src="../../src/MedAnnotateApp.Presentation/wwwroot/js/canvas.js"></script>
<script>
const samples=[{id:1,url:'https://csvc.nejm.org/ContentServer/images?id=IC20261022&width=1500&height=4000'},
{id:548,url:'https://csvc.nejm.org/ContentServer/images?id=IC20160428&width=1500&height=4000'},
{id:1095,url:'https://csvc.nejm.org/ContentServer/images?id=IC20051013&width=1500&height=4000'}];
for(const sample of samples){
 const section=document.createElement('section');section.className='left-column';
 const label=document.createElement('h2');label.textContent=`MedData ${sample.id}`;section.appendChild(label);
 const result=document.createElement('p');result.className='result';result.textContent='Loading remote image…';section.appendChild(result);
 const imageFrame=document.createElement('div');section.appendChild(imageFrame);
 const container=document.createElement('div');container.id=`container-${sample.id}`;imageFrame.appendChild(container);
 const image=document.createElement('img');image.id=`image-${sample.id}`;image.hidden=true;image.alt=`Stored source ${sample.id}`;container.appendChild(image);
 const canvas=document.createElement('canvas');canvas.id=`canvas-${sample.id}`;container.appendChild(canvas);document.getElementById('results').appendChild(section);
 image.src=sample.url;
 const manager=new CanvasManager(canvas.id,image.id,container.id);
 const update=()=>{result.textContent=manager.ready?`PASS: remote image loaded and rendered to canvas; original ${image.naturalWidth} × ${image.naturalHeight}; backing ${canvas.width} × ${canvas.height}.`:'FAIL: remote image could not load.';};
 canvas.addEventListener('annotationimageready',update);canvas.addEventListener('annotationimageerror',update);if(manager.ready)update();
}
</script></html>
