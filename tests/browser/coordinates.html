<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Annotation coordinate fixture</title>
<style>body{margin:32px;font-family:sans-serif}.left-column{width:720px;max-width:90vw}#image-container,#canvasContainer{padding:0;border:0}#image-container{outline:3px solid #345}canvas{display:block;touch-action:none}.tool-button{width:36px;height:36px}.tool-button img{width:20px}.tools-container{display:flex;flex-direction:column;gap:6px;background:white}#annotation-status{margin:16px 0}</style></head><body>
<h1>Original pixel coordinate fixture</h1><p>Draw over the green target; expected corners [300,200],[900,200],[900,600],[300,600]. Resize the window, scroll, change browser zoom, move, rotate, resize and delete. Save/reload keeps the same image coordinates.</p>
<p><button id="save">Serialize</button><button id="reload">Reload serialized shape</button><button id="clear">Clear</button><button id="narrow">Toggle display width</button></p>
<div id="annotation-status" role="status"></div><div class="left-column"><div id="image-container"><img id="sourceImage" src="fixture.svg" hidden><div id="canvasContainer"><canvas id="mainCanvas"></canvas></div></div></div>
<pre id="result"></pre><div style="height:800px"></div>
<script src="../../src/MedAnnotateApp.Presentation/wwwroot/js/annotationGeometry.js"></script><script src="../../src/MedAnnotateApp.Presentation/wwwroot/js/canvas.js"></script>
<script>
const manager=window.canvasManager=new CanvasManager('mainCanvas','sourceImage','canvasContainer');
const tools=manager.createTools(document.getElementById('image-container'));
document.querySelectorAll('.tool-button img').forEach(img=>img.src='../../src/MedAnnotateApp.Presentation/wwwroot/images/'+img.getAttribute('src').split('/').pop());
tools.rectButton.onclick=()=>manager.switchMode('rectangle');
tools.freehandButton.onclick=()=>manager.switchMode('freehand');
tools.magnifyButton.onclick=()=>manager.switchMode('magnifier');
let serialized='';
document.getElementById('save').onclick=()=>{try{serialized=manager.getAllAnnotationsJSON();document.getElementById('result').textContent=serialized;}catch(e){document.getElementById('result').textContent=e.message;}};
document.getElementById('reload').onclick=()=>manager.loadCoordinates(serialized);
document.getElementById('clear').onclick=()=>manager.resetAnnotation();
document.getElementById('narrow').onclick=()=>{const c=document.querySelector('.left-column');c.style.width=c.style.width==='360px'?'720px':'360px';manager.resizeDisplay();};
</script></body></html>
