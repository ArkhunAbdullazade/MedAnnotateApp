services:
  webapp:
    image: medannotateapp
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - key_data:/app/keys
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_HTTPS_PORT: 443
      ConnectionStrings__MedDataDb: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      AuthorizationAccessPasswordHash: ${AUTHORIZATION_ACCESS_PASSWORD_HASH}
      DataProtection__KeysPath: /app/keys
      AllowedHosts: ${PUBLIC_HOST:-localhost}
      ReverseProxy__KnownProxies__0: ${REVERSE_PROXY_IP:-127.0.0.1}
      Database__ApplyMigrations: "false"
      Database__SeedExcel: "false"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  key_data:
