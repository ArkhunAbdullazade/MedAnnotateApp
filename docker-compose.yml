services:
  webapp:
    image: medannotateapp
    depends_on:
      - postgres
      - redis
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./keys:/app/keys
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__MedDataDb: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RedisConnection: redis:6379
      AuthorizationAccessPasswordHash: ${AUTHORIZATION_ACCESS_PASSWORD_HASH}
      DataProtection__KeysPath: /app/keys
      SmtpSettings__Server: ${SMTP_SERVER}
      SmtpSettings__Port: ${SMTP_PORT}
      SmtpSettings__SenderName: ${SMTP_SENDER_NAME}
      SmtpSettings__SenderEmail: ${SMTP_SENDER_EMAIL}
      SmtpSettings__Password: ${SMTP_PASSWORD}
      SmtpSettings__EnableSsl: ${SMTP_ENABLE_SSL}

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  db_data:
